name: Start MyJournal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: go mod download

      - name: Build and run project
        run: make run
